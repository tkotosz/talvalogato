name: Menu data

# Reads Teletál's published menus and commits them as JSON to the data branch, which the Worker serves.
on:
  schedule:
    # 04:00 and 10:30 UTC: early morning, and shortly after Teletál's noon ordering deadline in Budapest.
    - cron: '0 4 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: menu-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh menu data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Check out the data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" data > /dev/null; then
            git clone --quiet --depth 1 --branch data --single-branch "$remote" data
          else
            # The first run starts the branch without any history.
            git init --quiet --initial-branch data data
            git -C data remote add origin "$remote"
          fi

      - name: Read Teletál
        run: npm run refresh-menu -- --out data/menu

      - name: Commit changes
        working-directory: data
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo 'The menu data has not changed.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet --message 'Refresh menu data'
          git push --quiet origin data
